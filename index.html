<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tiru Aku — Game Ice Breaking</title>
<style>
  :root {
    --bg: #2a2370;
    --bg-2: #382f8f;
    --card: #fff8ec;
    --ink: #1d1747;
    --muted: #6d669c;
    --pop: #ffd23f;
    --spy: #ff3d6e;
    --ok: #27c28a;
    --line: #d9d1f5;
    --radius: 18px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Avenir Next Rounded", "Nunito", "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
    font-size: 16px;
    line-height: 1.45;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }
  main { max-width: 560px; margin: 0 auto; padding: 20px 16px 48px; }
  h1, h2, h3 { margin: 0; line-height: 1.15; }
  .logo { color: #fff; font-size: 2.6rem; font-weight: 900; letter-spacing: -0.02em; }
  .logo span { display: inline-block; background: var(--spy); color: #fff; padding: 0 10px; border-radius: 12px; transform: rotate(-3deg); }
  .tag { color: #cfc8ff; margin: 8px 0 24px; }
  .card { background: var(--card); border-radius: var(--radius); padding: 18px; margin-bottom: 14px; }
  .card.dark { background: var(--bg-2); color: #fff; }
  label { display: block; font-weight: 800; margin-bottom: 6px; }
  input[type=text], textarea {
    width: 100%; font: inherit; color: var(--ink); background: #fff;
    border: 2px solid var(--line); border-radius: 12px; padding: 12px 14px;
  }
  input[type=text]:focus, textarea:focus { outline: 3px solid var(--pop); border-color: var(--ink); }
  textarea { min-height: 280px; resize: vertical; }
  button {
    font: inherit; font-weight: 800; cursor: pointer; border: 0; border-radius: 14px;
    padding: 13px 18px; background: var(--pop); color: var(--ink);
    box-shadow: 0 4px 0 rgba(29,23,71,.35); transition: transform .08s, box-shadow .08s;
  }
  button:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(29,23,71,.35); }
  button:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
  button.alt { background: #fff; }
  button.ghost { background: transparent; color: inherit; box-shadow: none; border: 2px solid currentColor; }
  button.danger { background: var(--spy); color: #fff; }
  button.block { width: 100%; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .row { display: flex; gap: 10px; align-items: center; }
  .row.wrap { flex-wrap: wrap; }
  .grow { flex: 1; }
  .muted { color: var(--muted); }
  .dark .muted { color: #cfc8ff; }
  .divider { text-align: center; color: #cfc8ff; margin: 14px 0; }

  .code { font-size: 3.4rem; font-weight: 900; letter-spacing: .18em; text-align: center; color: var(--pop); }
  .small-code { font-weight: 900; letter-spacing: .12em; color: var(--pop); }

  .players { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; background: #fff; color: var(--ink); border-radius: 999px; padding: 6px 12px; font-weight: 700; }
  .chip i { width: 9px; height: 9px; border-radius: 50%; background: var(--ok); display: inline-block; }
  .chip.off i { background: #bbb; }
  .chip.spy { background: var(--spy); color: #fff; }
  .chip.spy i { background: #fff; }
  .chip button { padding: 0 6px; background: none; box-shadow: none; color: var(--muted); font-size: 1.1rem; line-height: 1; }

  .stepper { display: flex; align-items: center; gap: 14px; }
  .stepper button { width: 46px; height: 46px; padding: 0; font-size: 1.5rem; }
  .stepper b { font-size: 2rem; min-width: 2ch; text-align: center; }

  details summary { cursor: pointer; font-weight: 800; }
  details[open] summary { margin-bottom: 10px; }

  .call {
    border-radius: var(--radius); padding: 22px 18px; text-align: center; margin-bottom: 14px;
    background: var(--pop); color: var(--ink);
  }
  .call.spy { background: var(--spy); color: #fff; }
  .call.idle { background: var(--bg-2); color: #cfc8ff; }
  .call .num { font-size: 4.5rem; font-weight: 900; line-height: 1; }
  .call .act { font-size: 1.5rem; font-weight: 800; margin-top: 8px; }
  .call.pulse { animation: pop .35s ease-out; }
  @keyframes pop { from { transform: scale(.94); } to { transform: scale(1); } }
  @media (prefers-reduced-motion: reduce) { .call.pulse { animation: none; } button { transition: none; } }

  .role { border-radius: 12px; padding: 10px 14px; font-weight: 800; margin-bottom: 14px; text-align: center; }
  .role.spy { background: var(--spy); color: #fff; }
  .role.ok { background: var(--ok); color: #08301f; }

  .list { display: grid; gap: 8px; }
  .item {
    display: flex; gap: 12px; align-items: center; text-align: left;
    background: #fff; color: var(--ink); border-radius: 14px; padding: 10px 12px; width: 100%;
    border: 3px solid transparent; box-shadow: none;
  }
  .item .n { flex: none; width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center; background: var(--ink); color: #fff; font-weight: 900; }
  .item.spyrow { background: #ffe3ea; color: #9b1237; }
  .item.spyrow .n { background: var(--spy); }
  .item.active { border-color: var(--ink); background: var(--pop); }
  .item.spyrow.active { background: var(--spy); color: #fff; }
  .item.spyrow.active .n { background: #fff; color: var(--spy); }
  button.item { cursor: pointer; box-shadow: none; font-weight: 700; }
  button.item:active { transform: scale(.98); }

  .reveal { text-align: center; }
  .reveal h3 { margin-bottom: 8px; }
  #toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(120px);
    background: var(--ink); color: #fff; padding: 12px 18px; border-radius: 12px; font-weight: 700;
    max-width: 90vw; transition: transform .25s; z-index: 10; border: 2px solid var(--pop);
  }
  #toast.show { transform: translateX(-50%) translateY(0); }
  .hidden { display: none !important; }
  #banner { position: fixed; top: 0; left: 0; right: 0; background: var(--spy); color: #fff; text-align: center; padding: 10px; font-weight: 800; z-index: 20; }
</style>
</head>
<body>
<div id="banner" class="hidden" role="status"></div>
<main id="app"></main>
<div id="toast" role="status" aria-live="polite"></div>
<script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js"></script>
<script>
const TOTAL = 20;
const DEFAULT_ACTIVITIES = [
  'Lompat di tempat 3 kali','Tepuk tangan sambil berputar','Pura-pura jadi kucing mengeong','Joget goyang pinggul',
  'Pegang hidung dengan tangan kiri','Jalan mundur 3 langkah','Pura-pura menyetir mobil','Salaman dengan orang di sebelahmu',
  'Pose superhero sambil teriak "Hore!"','Pura-pura makan mie yang panas','Mengangkat kedua tangan dan geleng-geleng',
  'Jongkok lalu berdiri cepat 2 kali','Pura-pura menggendong bayi','Tutup mata sambil tersenyum lebar','Pura-pura main gitar',
  'Lambaikan tangan ke semua orang','Berdiri satu kaki selama 5 detik','Pura-pura jadi robot','Tos dengan 2 orang berbeda',
  'Pura-pura berenang gaya bebas'
];

const $ = s => document.querySelector(s);
const app = $('#app');
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const rid = () => Array.from(crypto.getRandomValues(new Uint8Array(8)), b => b.toString(16).padStart(2, '0')).join('');
const randInt = n => crypto.getRandomValues(new Uint32Array(1))[0] % n;
const genCode = () => { const c = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; return Array.from({ length: 4 }, () => c[randInt(c.length)]).join(''); };

function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 3500);
}
function banner(msg, leave) {
  const b = $('#banner');
  if (!msg) { b.classList.add('hidden'); return; }
  b.textContent = msg + ' ';
  if (leave) {
    const x = document.createElement('button'); x.textContent = 'Keluar'; x.className = 'alt'; x.style.padding = '4px 12px';
    x.onclick = () => { save('spy_session', null); location.reload(); };
    b.appendChild(x);
  }
  b.classList.remove('hidden');
}

/* ---------- session (disimpan di browser) ---------- */
const load = k => { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } };
const save = (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };

let view = null, viewKey = '', lastCalled = null;

/* =====================================================
   JARINGAN: pesan lewat broker MQTT publik (WebSocket/443),
   jadi tidak peduli HP-nya beda WiFi / beda provider.
   Dua broker dipakai sekaligus sebagai cadangan.
   ===================================================== */
const BROKERS = ['wss://broker.emqx.io:8084/mqtt', 'wss://broker.hivemq.com:8884/mqtt'];
const base = code => 'tiruaku/v1/' + code;

class Bus {
  constructor() { this.cs = []; this.subs = new Set(); this.onMsg = () => {}; this.onConnect = () => {}; }
  start() {
    BROKERS.forEach(url => {
      const c = mqtt.connect(url, { clientId: 'ta_' + rid(), clean: true, keepalive: 30, reconnectPeriod: 2000, connectTimeout: 8000 });
      c.on('connect', () => { this.subs.forEach(t => c.subscribe(t, { qos: 0 })); this.onConnect(); });
      c.on('message', (topic, payload) => {
        let m; try { m = JSON.parse(payload.toString()); } catch (e) { return; }
        this.onMsg(topic, m);
      });
      c.on('error', () => {});
      this.cs.push(c);
    });
  }
  sub(t) { this.subs.add(t); this.cs.forEach(c => c.connected && c.subscribe(t, { qos: 0 })); }
  pub(t, m, retain) { const s = JSON.stringify(m); this.cs.forEach(c => c.connected && c.publish(t, s, { qos: 0, retain: !!retain })); }
  get ok() { return this.cs.some(c => c.connected); }
  stop() { this.cs.forEach(c => { try { c.end(true); } catch (e) {} }); }
}

let bus = null, timers = [];
const every = (fn, ms) => timers.push(setInterval(fn, ms));
function teardown() { timers.forEach(clearInterval); timers = []; if (bus) { bus.stop(); bus = null; } }

/* =====================================================
   ADMIN = HOST. Semua logika game jalan di browser admin.
   ===================================================== */
let H = null;
const seen = new Map();   // playerId -> terakhir kelihatan
let vSeq = 0, lastSig = '', emitT = null;
const nextV = () => (vSeq = Math.max(Date.now(), vSeq + 1));
const isOnline = id => Date.now() - (seen.get(id) || 0) < 25000;

function freshRoom(code) {
  return { code, phase: 'lobby', players: new Map(), spies: new Set(), spyCount: 1,
           activities: [...DEFAULT_ACTIVITIES], called: null, revealed: false };
}
function saveHost() {
  save('spy_host', { code: H.code, phase: H.phase, players: [...H.players.values()].map(p => ({ id: p.id, name: p.name })),
    spies: [...H.spies], spyCount: H.spyCount, activities: H.activities, called: H.called, revealed: H.revealed });
}
function restoreHost(d) {
  H = freshRoom(d.code);
  H.phase = d.phase; H.spyCount = d.spyCount; H.activities = d.activities; H.called = d.called; H.revealed = d.revealed;
  H.spies = new Set(d.spies);
  d.players.forEach(p => H.players.set(p.id, { id: p.id, name: p.name }));
}
const playerList = () => [...H.players.values()].map(p => ({ id: p.id, name: p.name, online: isOnline(p.id) }));
const spyNames = () => [...H.players.values()].filter(p => H.spies.has(p.id)).map(p => p.name);

function adminState() {
  return { role: 'admin', code: H.code, phase: H.phase, players: playerList(), spyCount: H.spyCount,
    activities: H.activities, called: H.called, spies: H.phase === 'playing' ? [...H.spies] : [], revealed: H.revealed };
}
function playerState(p) {
  const playing = H.phase === 'playing';
  const isSpy = playing && H.spies.has(p.id);
  return { role: 'player', code: H.code, phase: H.phase, me: { id: p.id, name: p.name }, players: playerList(), isSpy,
    activities: playing && !isSpy ? H.activities : null, called: H.called, revealed: H.revealed ? spyNames() : null };
}
function pubPlayer(p) {
  if (bus) bus.pub(base(H.code) + '/p/' + p.id, { t: 'state', v: nextV(), s: playerState(p) }, true);
}
function emitAll() {
  clearTimeout(emitT);
  lastSig = playerList().map(p => p.online).join();
  saveHost();
  receive(adminState());
  for (const p of H.players.values()) pubPlayer(p);
}
const soon = () => { clearTimeout(emitT); emitT = setTimeout(emitAll, 400); };

function startHost(code) {
  teardown();
  const b = base(code);
  bus = new Bus();
  bus.onMsg = hostOnMsg;
  bus.onConnect = () => { banner(null); bus.pub(b + '/h', { ts: Date.now() }, true); emitAll(); };
  bus.start();
  bus.sub(b + '/join'); bus.sub(b + '/hb');
  every(() => bus && bus.pub(b + '/h', { ts: Date.now() }, true), 5000);
  every(() => {
    if (!bus) return;
    if (!bus.ok) banner('Koneksi terputus, menyambung ulang…');
    else banner(null);
    if (playerList().map(p => p.online).join() !== lastSig) emitAll();
  }, 5000);
  banner('Menyambung ke server…');
  receive(adminState());
}

function hostOnMsg(topic, m) {
  if (!H || !m) return;
  if (topic.endsWith('/hb') && m.pid && H.players.has(m.pid)) {
    const was = isOnline(m.pid); seen.set(m.pid, Date.now()); if (!was) soon();
  } else if (topic.endsWith('/join') && m.t === 'join') onJoin(m);
}

function onJoin(m) {
  if (!/^[0-9a-f]{16}$/.test(String(m.pid))) return;
  const pid = m.pid, tp = base(H.code) + '/p/' + pid;
  const reply = o => bus.pub(tp, o, false);
  let p = H.players.get(pid);
  const was = p && isOnline(pid);
  seen.set(pid, Date.now());
  if (!p) {
    if (H.phase !== 'lobby') return reply({ t: 'error', msg: 'Game sudah dimulai. Minta admin balik ke lobby dulu.' });
    if (H.players.size >= 60) return reply({ t: 'error', msg: 'Room sudah penuh.' });
    const name = String(m.name || '').replace(/\s+/g, ' ').trim().slice(0, 20);
    if (!name) return reply({ t: 'error', msg: 'Isi namamu dulu.' });
    if ([...H.players.values()].some(x => x.name.toLowerCase() === name.toLowerCase()))
      return reply({ t: 'error', msg: 'Nama itu sudah dipakai, coba nama lain.' });
    p = { id: pid, name };
    H.players.set(pid, p);
    reply({ t: 'joined', name });
    return emitAll();
  }
  reply({ t: 'joined', name: p.name });
  pubPlayer(p);
  if (!was) soon();
}

function act(type, d) {
  if (!H) return;
  if (type === 'config' && H.phase === 'lobby') {
    if (Number.isInteger(d.spyCount) && d.spyCount >= 1 && d.spyCount <= 30) H.spyCount = d.spyCount;
    if (d.activities) {
      if (d.activities.length !== TOTAL) return toast('Kegiatan harus tepat 20 baris.');
      H.activities = d.activities.map(a => a.slice(0, 120));
    }
  } else if (type === 'start') {
    const ids = [...H.players.keys()];
    if (ids.length < 2) return toast('Minimal 2 pemain untuk mulai.');
    if (H.spyCount >= ids.length) return toast('Jumlah spy harus lebih sedikit dari jumlah pemain.');
    for (let i = ids.length - 1; i > 0; i--) { const j = randInt(i + 1); [ids[i], ids[j]] = [ids[j], ids[i]]; }
    H.spies = new Set(ids.slice(0, H.spyCount));
    H.phase = 'playing'; H.called = null; H.revealed = false;
  } else if (type === 'call' && H.phase === 'playing') {
    if (!Number.isInteger(d) || d < 1 || d > TOTAL) return;
    H.called = d;
  } else if (type === 'reveal' && H.phase === 'playing') {
    H.revealed = true;
  } else if (type === 'reset') {
    H.phase = 'lobby'; H.spies = new Set(); H.called = null; H.revealed = false;
  } else if (type === 'kick') {
    if (bus) bus.pub(base(H.code) + '/p/' + d, { t: 'kicked' }, true);
    H.players.delete(d); H.spies.delete(d); seen.delete(d);
  } else return;
  emitAll();
}

function createRoom(attempt = 0) {
  teardown();
  banner('Membuat room…');
  const code = genCode(), b = base(code);
  let taken = false;
  const tmp = bus = new Bus();
  tmp.onMsg = t => { if (t === b + '/h') taken = true; };
  tmp.start(); tmp.sub(b + '/h');
  setTimeout(() => {
    if (bus !== tmp) return;
    if (!tmp.ok) { teardown(); banner(null); return toast('Tidak bisa tersambung ke server. Cek internetmu lalu coba lagi.'); }
    if (taken && attempt < 8) return createRoom(attempt + 1);
    H = freshRoom(code);
    startHost(code);
  }, 2500);
}

/* =====================================================
   PEMAIN. Hanya menerima state miliknya sendiri.
   ===================================================== */
function connectPlayer(code, name, pid, rejoining) {
  teardown();
  pid = pid || rid();
  const b = base(code), tp = b + '/p/' + pid;
  let joined = false, lastV = 0, tries = 0, tick = 0, lastHost = Date.now();
  const markJoined = () => { if (!joined) { joined = true; save('spy_session', { code, pid, name }); banner(null); } };
  const leave = () => { save('spy_session', null); teardown(); banner(null); if (viewKey !== 'home') showHome(); };
  const sendJoin = () => bus && bus.pub(b + '/join', { t: 'join', pid, name });

  bus = new Bus();
  bus.onMsg = (topic, m) => {
    if (topic === b + '/h') { lastHost = Date.now(); return; }
    if (topic !== tp || !m) return;
    if (m.t === 'joined') markJoined();
    else if (m.t === 'state') { if (m.v <= lastV) return; lastV = m.v; markJoined(); receive(m.s); }
    else if (m.t === 'error') { leave(); toast(m.msg); }
    else if (m.t === 'kicked') { leave(); toast('Kamu dikeluarkan dari room.'); }
  };
  bus.onConnect = sendJoin;
  bus.start(); bus.sub(tp); bus.sub(b + '/h');
  every(() => {
    if (!bus) return;
    tick++;
    if (!joined) {
      tries++; sendJoin();
      if (!rejoining && tries > 6) { teardown(); toast('Room tidak ditemukan atau admin sedang offline. Cek lagi kodenya.'); return; }
    } else if (tick % 4 === 0) bus.pub(b + '/hb', { pid });
    if (!bus.ok) banner('Koneksi terputus, menyambung ulang…', true);
    else if (joined && Date.now() - lastHost > 20000) banner('Admin terputus. Menunggu…', true);
    else if (rejoining && !joined) banner('Menyambung ke room…', true);
    else banner(null);
  }, 2000);
}

/* ---------- layar awal ---------- */
function showHome() {
  viewKey = 'home'; view = null;
  const prefill = new URLSearchParams(location.search).get('room') || '';
  app.innerHTML = `
    <h1 class="logo">Tiru <span>Aku</span></h1>
    <p class="tag">Semua gerak sesuai nomor kegiatan. Yang spy harus pura-pura tahu.</p>
    <div class="card">
      <label for="code">Kode room</label>
      <input id="code" type="text" maxlength="4" autocapitalize="characters" autocomplete="off" placeholder="mis. K7QA" value="${esc(prefill.toUpperCase())}">
      <div style="height:12px"></div>
      <label for="name">Namamu</label>
      <input id="name" type="text" maxlength="20" autocomplete="off" placeholder="mis. Budi">
      <div style="height:14px"></div>
      <button id="join" class="block">Masuk room</button>
    </div>
    <div class="divider">atau kamu yang jadi admin?</div>
    <button id="create" class="block alt">Buat room baru</button>`;
  $('#join').onclick = join;
  $('#name').onkeydown = e => { if (e.key === 'Enter') join(); };
  $('#create').onclick = () => createRoom();
}
function join() {
  const code = $('#code').value.trim().toUpperCase(), name = $('#name').value.trim();
  if (!code || !name) return toast('Isi kode room dan namamu dulu.');
  toast('Menyambung ke room…');
  connectPlayer(code, name, null, false);
}

/* ---------- render sesuai state ---------- */
function receive(st) {
  view = st;
  const key = st.role + ':' + st.phase;
  if (key !== viewKey) buildScreen(st);
  updateScreen(st);
  lastCalled = st.called;
}

function buildScreen(st) {
  viewKey = st.role + ':' + st.phase;
  lastCalled = null;
  if (st.role === 'admin' && st.phase === 'lobby') {
    app.innerHTML = `
      <h2 class="logo" style="font-size:1.6rem">Kamu admin</h2>
      <div class="card dark">
        <div class="muted">Bagikan kode ini ke peserta</div>
        <div class="code" id="roomcode"></div>
        <button id="copy" class="ghost block">Salin link ajakan</button>
        <p class="muted" style="margin:10px 0 0;font-size:.9rem">Jangan tutup tab ini selama game berlangsung.</p>
      </div>
      <div class="card">
        <h3>Pemain <span id="pcount" class="muted"></span></h3>
        <div id="plist" class="players"></div>
      </div>
      <div class="card">
        <h3>Jumlah spy</h3>
        <div class="stepper" style="margin-top:10px">
          <button id="minus" class="alt" aria-label="Kurangi spy">−</button>
          <b id="spyN">1</b>
          <button id="plus" class="alt" aria-label="Tambah spy">+</button>
        </div>
      </div>
      <div class="card">
        <details>
          <summary>Edit 20 kegiatan</summary>
          <p class="muted">Satu kegiatan per baris, tepat 20 baris. Nomor mengikuti urutan.</p>
          <textarea id="acts" spellcheck="false"></textarea>
          <div style="height:10px"></div>
          <button id="saveActs" class="alt block">Simpan kegiatan</button>
        </details>
      </div>
      <button id="start" class="block">Mulai game</button>`;
    $('#roomcode').textContent = st.code;
    $('#acts').value = st.activities.join('\n');
    $('#copy').onclick = () => {
      const link = location.origin + location.pathname + '?room=' + st.code;
      (navigator.clipboard ? navigator.clipboard.writeText(link) : Promise.reject()).then(() => toast('Link tersalin.'), () => toast(link));
    };
    $('#minus').onclick = () => act('config', { spyCount: Math.max(1, view.spyCount - 1) });
    $('#plus').onclick = () => act('config', { spyCount: view.spyCount + 1 });
    $('#saveActs').onclick = () => {
      const lines = $('#acts').value.split('\n').map(s => s.trim()).filter(Boolean);
      if (lines.length !== 20) return toast('Harus tepat 20 baris (sekarang ' + lines.length + ').');
      act('config', { activities: lines }); toast('Kegiatan disimpan.');
    };
    $('#start').onclick = () => act('start');
  }
  else if (st.role === 'admin' && st.phase === 'playing') {
    app.innerHTML = `
      <div class="row" style="margin-bottom:12px">
        <h2 class="logo grow" style="font-size:1.4rem">Room <span class="small-code" id="roomcode"></span></h2>
        <button id="reset" class="ghost" style="color:#fff">Balik ke lobby</button>
      </div>
      <div class="card">
        <h3>Spy kali ini</h3>
        <div id="spies" class="players"></div>
        <div style="height:12px"></div>
        <button id="reveal" class="danger block">Bongkar spy ke semua orang</button>
      </div>
      <div id="callcard"></div>
      <h3 style="color:#fff;margin:6px 0 10px">Ketuk nomor untuk diumumkan</h3>
      <div id="grid" class="list"></div>`;
    $('#roomcode').textContent = st.code;
    $('#reset').onclick = () => { if (confirm('Balik ke lobby? Spy akan diacak ulang di ronde berikutnya.')) act('reset'); };
    $('#reveal').onclick = () => act('reveal');
  }
  else if (st.role === 'player' && st.phase === 'lobby') {
    app.innerHTML = `
      <h2 class="logo" style="font-size:1.6rem">Halo, <span id="me"></span></h2>
      <div class="card dark">
        <div class="muted">Room</div>
        <div class="code" id="roomcode"></div>
        <p class="muted" style="text-align:center;margin:0">Menunggu admin memulai game…</p>
      </div>
      <div class="card">
        <h3>Sudah masuk <span id="pcount" class="muted"></span></h3>
        <div id="plist" class="players"></div>
      </div>
      <button id="leave" class="ghost block" style="color:#fff">Keluar</button>`;
    $('#me').textContent = st.me.name;
    $('#roomcode').textContent = st.code;
    $('#leave').onclick = () => { save('spy_session', null); location.reload(); };
  }
  else if (st.role === 'player' && st.phase === 'playing') {
    app.innerHTML = `
      <div id="rolebox"></div>
      <div id="callcard"></div>
      <div id="revealbox"></div>
      <div id="grid" class="list"></div>`;
  }
}

function updateScreen(st) {
  const pulse = st.called !== null && st.called !== lastCalled;

  if (st.role === 'admin' && st.phase === 'lobby') {
    $('#pcount').textContent = '(' + st.players.length + ')';
    $('#plist').innerHTML = st.players.length
      ? st.players.map(p => `<span class="chip ${p.online ? '' : 'off'}"><i></i>${esc(p.name)}<button data-k="${p.id}" aria-label="Keluarkan ${esc(p.name)}">×</button></span>`).join('')
      : '<span class="muted">Belum ada yang masuk.</span>';
    document.querySelectorAll('[data-k]').forEach(b => b.onclick = () => act('kick', b.dataset.k));
    $('#spyN').textContent = st.spyCount;
    $('#start').disabled = st.players.length < 2 || st.spyCount >= st.players.length;
  }
  else if (st.role === 'admin' && st.phase === 'playing') {
    const spySet = new Set(st.spies);
    $('#spies').innerHTML = st.players.filter(p => spySet.has(p.id)).map(p => `<span class="chip spy"><i></i>${esc(p.name)}</span>`).join('');
    $('#reveal').disabled = st.revealed;
    $('#reveal').textContent = st.revealed ? 'Spy sudah dibongkar' : 'Bongkar spy ke semua orang';
    renderCall(st, st.activities[st.called - 1], false, pulse);
    $('#grid').innerHTML = st.activities.map((a, i) =>
      `<button class="item ${st.called === i + 1 ? 'active' : ''}" data-n="${i + 1}"><span class="n">${i + 1}</span><span>${esc(a)}</span></button>`).join('');
    document.querySelectorAll('[data-n]').forEach(b => b.onclick = () => act('call', +b.dataset.n));
  }
  else if (st.role === 'player' && st.phase === 'lobby') {
    $('#pcount').textContent = '(' + st.players.length + ')';
    $('#plist').innerHTML = st.players.map(p => `<span class="chip ${p.online ? '' : 'off'}"><i></i>${esc(p.name)}</span>`).join('');
  }
  else if (st.role === 'player' && st.phase === 'playing') {
    $('#rolebox').innerHTML = st.isSpy
      ? '<div class="role spy">Kamu adalah spy. Tirukan gerakan orang lain!</div>'
      : '<div class="role ok">Kamu bukan spy. Lakukan kegiatan sesuai nomor.</div>';
    renderCall(st, st.isSpy ? null : st.activities[st.called - 1], st.isSpy, pulse);
    $('#revealbox').innerHTML = st.revealed
      ? `<div class="card reveal"><h3>Spy-nya adalah</h3><div class="players" style="justify-content:center">${st.revealed.map(n => `<span class="chip spy"><i></i>${esc(n)}</span>`).join('')}</div></div>`
      : '';
    const rows = [];
    for (let i = 0; i < 20; i++) {
      const text = st.isSpy ? 'YOU ARE THE SPY' : st.activities[i];
      rows.push(`<div class="item ${st.isSpy ? 'spyrow' : ''} ${st.called === i + 1 ? 'active' : ''}"><span class="n">${i + 1}</span><span>${esc(text)}</span></div>`);
    }
    $('#grid').innerHTML = rows.join('');
  }
}

function renderCall(st, text, isSpy, pulse) {
  const box = $('#callcard');
  if (st.called === null) {
    box.innerHTML = '<div class="call idle"><div class="act">Menunggu admin menyebut nomor…</div></div>';
    return;
  }
  const label = isSpy ? 'YOU ARE THE SPY' : text;
  box.innerHTML = `<div class="call ${isSpy ? 'spy' : ''} ${pulse ? 'pulse' : ''}"><div class="num">${st.called}</div><div class="act">${esc(label)}</div></div>`;
}

/* ---------- mulai ---------- */
(function init() {
  if (typeof mqtt === 'undefined') { app.innerHTML = '<div class="card"><h3>Gagal memuat library</h3><p>Cek koneksi internetmu lalu refresh halaman.</p></div>'; return; }
  const hs = load('spy_host'), ps = load('spy_session');
  if (hs) { restoreHost(hs); banner('Memulihkan room…'); app.innerHTML = ''; startHost(hs.code); }
  else if (ps) { banner('Menyambung ke room…', true); app.innerHTML = ''; connectPlayer(ps.code, ps.name, ps.pid, true); }
  else showHome();
})();
</script>
</body>
</html>
